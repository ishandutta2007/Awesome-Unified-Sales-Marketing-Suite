<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.75" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing & flowing background circuits */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.22; }
      50% { transform: scale(1.15); opacity: 0.42; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }

    .orb-glow-1 {
      transform-origin: 1060px 70px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-glow-2 {
      transform-origin: 120px 290px;
      animation: pulseOrb 9s ease-in-out infinite reverse;
    }
    .circuit-flow {
      stroke-dasharray: 12, 12;
      animation: flowLine 24s linear infinite;
    }
    .floating-pill-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatPillReverse 6s ease-in-out infinite;
    }
    .floating-pill-3 {
      animation: floatPill 5.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-glow-1">
    <circle cx="1060" cy="70" r="190" fill="#6366f1" filter="url(#glow)" opacity="0.22" />
  </g>
  <g class="orb-glow-2">
    <circle cx="120" cy="290" r="170" fill="#0284c7" filter="url(#glow)" opacity="0.20" />
  </g>

  <!-- High-Tech Grid Pattern in Background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Data Flow Paths in Background -->
  <g fill="none" stroke-width="2">
    <path class="circuit-flow" stroke="#38bdf8" opacity="0.38" d="M -50,90 Q 250,25 500,95 T 1000,55 T 1250,105" />
    <path class="circuit-flow" stroke="#a855f7" opacity="0.32" d="M -50,285 Q 300,345 600,280 T 1100,325 T 1250,270" />
    <path class="circuit-flow" stroke="#34d399" opacity="0.28" d="M -30,175 C 200,245 400,115 700,195 S 1100,145 1250,215" />
  </g>

  <!-- Dynamic Floating Feature Pills (Placed cleanly on outer margins, title remains front & center) -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="186" height="34" rx="17" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" filter="url(#subtle-glow)" />
    <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">💼 CRM &amp; PIPELINES</text>
  </g>

  <g class="floating-pill-2" transform="translate(945, 48)">
    <rect width="195" height="34" rx="17" fill="url(#pill-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#818cf8" filter="url(#subtle-glow)" />
    <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🤖 AGENTIC WORKFLOWS</text>
  </g>

  <g class="floating-pill-3" transform="translate(65, 276)">
    <rect width="186" height="34" rx="17" fill="url(#pill-grad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#34d399" filter="url(#subtle-glow)" />
    <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🚀 SALES FUNNELS</text>
  </g>

  <g class="floating-pill-1" transform="translate(940, 276)">
    <rect width="200" height="34" rx="17" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" filter="url(#subtle-glow)" />
    <text x="35" y="22" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">📬 EMAIL AUTOMATION</text>
  </g>

  <!-- FOREGROUND: Unobstructed, high-contrast Title & Subtitle Header -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="470" y="62" width="260" height="28" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1" opacity="0.95" />
    <text x="600" y="80" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">🌟 CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="148" fill="url(#title-grad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Unified Sales &amp; Marketing Suite
    </text>

    <!-- Subtitle -->
    <text x="600" y="192" fill="#f1f5f9" font-size="18" font-weight="500" letter-spacing="0.2">
      SaaS &amp; Open-Source Platforms • CRM • Automation • Funnels • RevOps
    </text>

    <!-- Feature Tags Row -->
    <text x="600" y="234" fill="#94a3b8" font-size="13" font-weight="400">
      ⚡ Live Pricing Benchmarks &nbsp;•&nbsp; 🏢 Enterprise Market Valuation &nbsp;•&nbsp; 🔓 Self-Hosted Alternatives
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#title-grad)" />
</svg>