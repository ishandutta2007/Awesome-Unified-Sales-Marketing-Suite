<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.80" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs using standard SMIL animateTransform -->
  <g transform="translate(1050, 70)">
    <circle cx="0" cy="0" r="180" fill="url(#glowGrad1)">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1; 1.25; 1"
        dur="7s"
        repeatCount="indefinite" />
      <animate
        attributeName="opacity"
        values="0.6; 1; 0.6"
        dur="7s"
        repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(120, 290)">
    <circle cx="0" cy="0" r="160" fill="url(#glowGrad2)">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1; 1.2; 1"
        dur="9s"
        repeatCount="indefinite" />
      <animate
        attributeName="opacity"
        values="0.5; 0.9; 0.5"
        dur="9s"
        repeatCount="indefinite" />
    </circle>
  </g>

  <!-- High-Tech Coordinate Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Circuit & Data Flow Paths -->
  <g fill="none" stroke-width="2">
    <path stroke="#38bdf8" stroke-dasharray="12 12" opacity="0.45" d="M -50,90 Q 250,25 500,95 T 1000,55 T 1250,105">
      <animate
        attributeName="stroke-dashoffset"
        from="400"
        to="0"
        dur="20s"
        repeatCount="indefinite" />
    </path>
    <path stroke="#c084fc" stroke-dasharray="12 12" opacity="0.4" d="M -50,285 Q 300,345 600,280 T 1100,325 T 1250,270">
      <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="400"
        dur="25s"
        repeatCount="indefinite" />
    </path>
    <path stroke="#34d399" stroke-dasharray="10 10" opacity="0.35" d="M -30,175 C 200,245 400,115 700,195 S 1100,145 1250,215">
      <animate
        attributeName="stroke-dashoffset"
        from="400"
        to="0"
        dur="22s"
        repeatCount="indefinite" />
    </path>
  </g>

  <!-- Outer Floating Feature Badges (Animated translation, unobtrusively placed at borders) -->
  <!-- Top Left Pill -->
  <g transform="translate(60, 48)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="60,48; 60,41; 60,48"
      dur="5s"
      repeatCount="indefinite" />
    <rect width="186" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CRM &amp; PIPELINES</text>
  </g>

  <!-- Top Right Pill -->
  <g transform="translate(945, 48)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="945,48; 945,55; 945,48"
      dur="6s"
      repeatCount="indefinite" />
    <rect width="195" height="34" rx="17" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#818cf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AGENTIC WORKFLOWS</text>
  </g>

  <!-- Bottom Left Pill -->
  <g transform="translate(65, 276)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="65,276; 65,269; 65,276"
      dur="5.5s"
      repeatCount="indefinite" />
    <rect width="186" height="34" rx="17" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SALES FUNNELS</text>
  </g>

  <!-- Bottom Right Pill -->
  <g transform="translate(940, 276)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="940,276; 940,283; 940,276"
      dur="5.2s"
      repeatCount="indefinite" />
    <rect width="200" height="34" rx="17" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">EMAIL AUTOMATION</text>
  </g>

  <!-- FOREGROUND: High-contrast, completely unobstructed Title & Subtitle Header -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Pill -->
    <rect x="470" y="62" width="260" height="28" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1" opacity="0.95" />
    <text x="600" y="80" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="148" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Unified Sales &amp; Marketing Suite
    </text>

    <!-- Subtitle -->
    <text x="600" y="192" fill="#f1f5f9" font-size="18" font-weight="500" letter-spacing="0.2">
      SaaS &amp; Open-Source Platforms &#x2022; CRM &#x2022; Automation &#x2022; Funnels &#x2022; RevOps
    </text>

    <!-- Feature Tags Row -->
    <text x="600" y="234" fill="#94a3b8" font-size="13" font-weight="400">
      Live Pricing Benchmarks &#x2022; Enterprise Market Valuation &#x2022; Self-Hosted Alternatives
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#titleGrad)" />
</svg>
